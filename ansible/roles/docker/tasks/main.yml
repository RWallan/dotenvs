---
- name: Instala o docker
  become: true
  community.general.pacman:
    name: "{{ docker_packages }}"
    state: present

- name: Habilita o serviço
  become: true
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}" # no --check o serviço pode ainda não existir
  when: ansible_facts.service_mgr == "systemd"

- name: Adiciona o usuário ao grupo docker
  become: true
  ansible.builtin.user:
    name: "{{ username }}"
    groups: docker
    append: true
  notify: Avisa sobre o grupo docker
