# Ambiente de desenvolvimento: Arch Linux nativo (com Hyprland) ou Arch no WSL.
#
#   ./bootstrap.sh                          # tudo (pede a senha do sudo)
#   ./bootstrap.sh --tags dotfiles          # só os links
#   ./bootstrap.sh --tags hyprland          # só o desktop
#   ./bootstrap.sh --check --diff           # simula, sem mudar nada
#   ./bootstrap.sh --list-tags
---
- name: Ambiente de desenvolvimento (Arch Linux / WSL)
  hosts: all

  pre_tasks:
    - name: Confere o sistema
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Archlinux"
          - ansible_facts.user_id != "root"
        fail_msg: >-
          Rode no Arch Linux como usuário comum (o playbook usa sudo quando precisa).
          WSL recém-instalado: primeiro `./bootstrap.sh --user <nome>` como root.
        quiet: true
      tags: [always]

    - name: Coleta os pacotes instalados
      ansible.builtin.package_facts:
      tags: [always]

    - name: Procura o usuário que compila pacotes do AUR
      ansible.builtin.getent:
        database: passwd
        key: "{{ aur_builder }}"
        fail_key: false
      tags: [always]

    # No --check o aur_builder ainda não foi criado de verdade: as tasks do AUR são puladas
    - name: Decide se as tasks do AUR podem rodar
      ansible.builtin.set_fact:
        aur_ready: "{{ not ansible_check_mode or ansible_facts.getent_passwd[aur_builder] is not none }}"
      tags: [always]

  roles:
    - role: base
      tags: [base]
    - role: wsl
      tags: [wsl]
      when: is_wsl | bool
    # environment: ferramentas instaladas na home (pyenv, rustup, uv, pipx...) visíveis aos comandos
    - role: languages
      tags: [languages]
      environment: &user_env
        PATH: "{{ user_path }}"
        PYENV_ROOT: "{{ home_dir }}/.pyenv"
    - role: cli
      tags: [cli]
    # No WSL o docker vem do Docker Desktop (integração com o Windows): nunca instala o nativo
    - role: docker
      tags: [docker]
      when: install_docker | bool and not (is_wsl | bool)
    - role: cloud
      tags: [cloud]
      when: install_cloud | bool
    - role: hyprland
      tags: [desktop, hyprland]
      when: not (is_wsl | bool) and desktop == "hyprland"
    - role: dotfiles
      tags: [dotfiles]
    - role: neovim
      tags: [nvim]
      environment: *user_env

  post_tasks:
    - name: Próximos passos
      ansible.builtin.debug:
        msg: >-
          {{ ['Abra um novo terminal para carregar o PATH e o .bashrc.', 'Valide com :checkhealth no Neovim.']
             + (['WSL: use uma Nerd Font (MesloLGS ou JetBrainsMono) no perfil do Arch no Windows Terminal.'] if (is_wsl | bool) else [])
             + (['Hyprland: faça login no TTY1 e ele abre sozinho. SUPER+Enter terminal, SUPER+D apps, SUPER+SHIFT+E sair.']
                if (not (is_wsl | bool) and desktop == 'hyprland') else []) }}
      tags: [always]
