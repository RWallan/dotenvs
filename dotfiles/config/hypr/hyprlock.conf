# https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/
# Catppuccin Mocha
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(1e1e2ecc)
    outer_color = rgba(cba6f7ee) rgba(89b4faee) 45deg
    check_color = rgba(a6e3a1ee)
    fail_color = rgba(f38ba8ee)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 8
    font_family = $font
    placeholder_text = Senha...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 90
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"%A, %d de %B"
    color = rgb(bac2de)
    font_size = 22
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}
