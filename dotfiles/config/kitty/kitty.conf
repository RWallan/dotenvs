# kitty — terminal do desktop Hyprland (no WSL o terminal é o Windows Terminal)
# Referência: https://sw.kovidgoyal.net/kitty/conf/

include mocha.conf

# Fonte (a mesma do vídeo: JetBrains Mono Nerd Font)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor com rastro (equivalente ao smooth_motion do alacritty)
cursor_shape          block
cursor_trail          3
cursor_blink_interval 0

# Janela
window_padding_width     6
background_opacity       0.95
hide_window_decorations  yes
confirm_os_window_close  0
enable_audio_bell        no

# O tmux faz splits/abas: o kitty fica simples
enabled_layouts  stack
tab_bar_style    hidden

# Performance
repaint_delay  8
input_delay    2
sync_to_monitor yes

# Integração com o shell e links
shell_integration enabled
detect_urls       yes
copy_on_select    no
strip_trailing_spaces smart

# Fonte maior/menor
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
