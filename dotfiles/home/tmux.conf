unbind r
bind r source-file ~/.tmux.conf
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g prefix C-s

set -g mouse on

# Neovim (:checkhealth): <Esc> sem atraso e eventos de foco (autoread)
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
# Copiar no tmux vai para o clipboard do Windows via OSC 52 (Windows Terminal)
set -g set-clipboard on

bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize with caps vim
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

# Yazi image preview compatibility
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Tema Catppuccin v2 (versão fixa: a v2 mudou as opções em relação à 0.x)
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_default_fill 'number'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#{pane_current_path}'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_status_connect_separator 'yes'

# Módulos da barra (na v2 são montados aqui; #{E:...} é expandido depois que o tema carrega)
set -g status-position top
set -g status-left ''
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}'

run '~/.tmux/plugins/tpm/tpm'
